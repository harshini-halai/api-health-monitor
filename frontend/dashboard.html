<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Website Health Monitor</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("whm_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/theme.css" />
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <a class="logo" href="/">
          <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg></span>
          Health Monitor
        </a>
        <nav class="side-nav" id="side-nav" aria-label="Dashboard">
          <a href="#overview" data-view="overview"><span>◧</span> Overview</a>
          <a href="#websites" data-view="websites"><span>⊞</span> My Websites</a>
          <a href="#history" data-view="history"><span>☰</span> Monitoring History</a>
          <a href="#analytics" data-view="analytics"><span>▥</span> Analytics</a>
        </nav>
        <a href="#extension" data-view="extension"><span>&#9889;</span> Chrome Extension</a>
        <div class="side-foot">
          <div class="user-box"><strong id="user-name">…</strong><span class="muted small" id="user-email"></span></div>
          <div class="side-btns">
            <button class="btn btn-sm" id="theme-btn" title="Toggle theme">◐ Theme</button>
            <button class="btn btn-sm btn-danger" id="logout-btn">Logout</button>
          </div>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <main class="main">
        <header class="topbar">
          <button class="btn btn-sm menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
          <h1 id="page-title">Overview</h1>
          <button class="btn btn-sm" id="refresh-btn">↻ Refresh</button>
        </header>
        <div class="content">
          <section id="view-overview" class="view hidden"></section>
          <section id="view-websites" class="view hidden"></section>
          <section id="view-history" class="view hidden"></section>
          <section id="view-analytics" class="view hidden"></section>
        <section id="view-extension" class="view hidden"></section>

          <section id="view-site" class="view hidden"></section>
        </div>
      </main>
    </div>

    <div class="toast-wrap" id="toasts" aria-live="polite"></div>

    <dialog id="confirm-dialog">
      <div class="dialog-body">
        <h2 class="dialog-title" id="confirm-title"></h2>
        <p class="muted" id="confirm-text"></p>
        <div class="dialog-actions">
          <button class="btn" id="confirm-cancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="confirm-ok" type="button">Confirm</button>
        </div>
      </div>
    </dialog>

    <dialog id="edit-dialog">
      <form class="dialog-body" id="edit-form" method="dialog" novalidate>
        <h2 class="dialog-title">Edit website</h2>
        <div class="stack">
          <div class="field"><label>URL</label><input type="text" id="edit-url" readonly /></div>
          <div class="field"><label for="edit-name">Display name</label><input type="text" id="edit-name" maxlength="100" /></div>
          <label class="check"><input type="checkbox" id="edit-enabled" /> Automatic monitoring every 5 minutes</label>
        </div>
        <div class="dialog-actions">
          <button class="btn" type="button" id="edit-cancel">Cancel</button>
          <button class="btn btn-primary" type="submit" id="edit-save">Save changes</button>
        </div>
      </form>
    </dialog>

    <dialog id="check-dialog" class="wide-dialog">
      <div class="dialog-body">
        <h2 class="dialog-title">Check details</h2>
        <div id="check-body"></div>
        <div class="dialog-actions"><button class="btn" type="button" id="check-close">Close</button></div>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
