<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerts &amp; Incidents · Website Health Monitor</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("whm_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/theme.css" />
    <link rel="stylesheet" href="/static/dashboard.css" />
    <style>
      .banner { padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
      .banner.warn { background: var(--warn-soft); color: var(--warn); }
      .row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .verify-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .hint { font-size: 13px; color: var(--muted); }
      .form-narrow { max-width: 560px; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <a class="logo" href="/">
          <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg></span>
          Health Monitor
        </a>
        <nav class="side-nav" aria-label="Dashboard">
          <a href="/dashboard#overview"><span>◧</span> Overview</a>
          <a href="/dashboard#websites"><span>⊞</span> My Websites</a>
          <a href="/dashboard#history"><span>☰</span> Monitoring History</a>
          <a href="/dashboard#analytics"><span>▥</span> Analytics</a>
          <a href="/dashboard/alerts" class="active"><span>✉</span> Alerts &amp; Incidents</a>
        </nav>
        <div class="side-foot">
          <div class="user-box"><strong id="user-name">…</strong><span class="muted small" id="user-email"></span></div>
          <div class="side-btns">
            <button class="btn btn-sm" id="theme-btn" title="Toggle theme">◐ Theme</button>
            <button class="btn btn-sm btn-danger" id="logout-btn">Logout</button>
          </div>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <main class="main">
        <header class="topbar">
          <button class="btn btn-sm menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
          <h1>Alerts &amp; Incidents</h1>
        </header>
        <div class="content">
          <section class="card panel">
            <h2>Email alerts</h2>
            <p class="muted small" style="margin: -8px 0 16px">
              Get one email when a website goes down and one when it recovers, not a new email on every check.
            </p>
            <div id="cfg-banner"></div>
            <form id="alert-form" class="stack form-narrow" novalidate>
              <div class="field">
                <label for="al-email">Send alerts to</label>
                <input id="al-email" type="email" autocomplete="email" required />
              </div>
              <div id="verify-state"></div>
              <div class="field">
                <label for="al-threshold">Alert me after</label>
                <select id="al-threshold">
                  <option value="1">1 failed check (fastest, more false alarms)</option>
                  <option value="2">2 consecutive failed checks (recommended)</option>
                  <option value="3">3 consecutive failed checks</option>
                  <option value="4">4 consecutive failed checks</option>
                  <option value="5">5 consecutive failed checks (slowest, fewest false alarms)</option>
                </select>
              </div>
              <label class="check"><input type="checkbox" id="al-enabled" /> Email me when a website goes down or recovers</label>
              <div class="row-actions">
                <button class="btn btn-primary" type="submit" id="al-save">Save settings</button>
                <button class="btn" type="button" id="al-test">Send test email</button>
              </div>
            </form>
          </section>

          <section class="card panel">
            <div class="toolbar">
              <h2 style="margin: 0">Incidents</h2>
              <select id="inc-status" class="select" aria-label="Filter incidents">
                <option value="">All incidents</option>
                <option value="open">Ongoing</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>Website</th><th>Started</th><th>Status</th><th>Duration</th><th>Reason</th></tr></thead>
                <tbody id="inc-body"></tbody>
              </table>
            </div>
            <div class="load-more" id="inc-foot"></div>
          </section>
        </div>
      </main>
    </div>

    <div class="toast-wrap" id="toasts" aria-live="polite"></div>
    <script src="/static/alerts.js"></script>
  </body>
</html>
